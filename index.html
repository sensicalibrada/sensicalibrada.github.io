
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Live</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #210044, #6900a8);
  color: white;
  text-align: center;
  padding: 20px;
}

h1 {
  color: gold;
  font-size: 32px;
}

p {
  font-size: 18px;
}

#numeros {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 9px;
  max-width: 500px;
  margin: 25px auto;
}

.numero {
  background: white;
  color: #57008c;
  border: none;
  border-radius: 10px;
  padding: 15px 5px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

.numero:disabled {
  background: #333;
  color: white;
  cursor: not-allowed;
}

#mensagem {
  font-size: 24px;
  font-weight: bold;
  color: gold;
  min-height: 60px;
  margin: 20px;
}

button#reiniciar {
  background: gold;
  color: #350052;
  border: none;
  border-radius: 12px;
  padding: 15px 30px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>🎁 DESAFIO DA LIVE 🎁</h1>
<p>Escolha um número de 1 até 100!</p>
<p>Será que você vai conseguir?</p>

<div id="numeros"></div>

<div id="mensagem"></div>

<button id="reiniciar" onclick="reiniciar()">
🔄 RECOMEÇAR
</button>

<script>
const area = document.getElementById("numeros");
const mensagem = document.getElementById("mensagem");

function criarNumeros() {
  area.innerHTML = "";

  for (let i = 1; i <= 100; i++) {
    const botao = document.createElement("button");

    botao.className = "numero";
    botao.textContent = i;

    botao.onclick = function() {
      botao.disabled = true;
      botao.textContent = "❌";

      mensagem.textContent = "😅 NÃO FOI DESSA VEZ! TENTE OUTRO!";

    };

    area.appendChild(botao);
  }
}

function reiniciar() {
  mensagem.textContent = "";
  criarNumeros();
}

criarNumeros();
</script>

</body>
</html>
